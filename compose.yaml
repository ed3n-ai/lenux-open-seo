services:
  open-seo:
    image: ${OPEN_SEO_IMAGE:-ghcr.io/every-app/open-seo:latest}
    restart: unless-stopped
    environment:
      # Required for local Docker self-hosting: exposes Compose env vars to cloudflare:workers bindings.
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=${PORT:-3001}
      - ALLOWED_HOST=${ALLOWED_HOST:-}
      - AUTH_MODE=local_noauth
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_CONTENT_MODEL=${OPENAI_CONTENT_MODEL:-gpt-5}
      - VITE_SHOW_DEVTOOLS=false
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    volumes:
      - open_seo_data:/app/.wrangler
  wordpress-api:
    build:
      context: ./services/wordpress-api
    restart: unless-stopped
    environment:
      - OPENSEO_WP_API_KEY=${OPENSEO_WP_API_KEY:-change-me}
      - OPENSEO_WP_ALLOWED_SITES=${OPENSEO_WP_ALLOWED_SITES:-}
      - OPENSEO_WP_PORT=${OPENSEO_WP_PORT:-8010}
    ports:
      - "127.0.0.1:${OPENSEO_WP_PORT:-8010}:${OPENSEO_WP_PORT:-8010}"
volumes:
  open_seo_data:
